{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>Traveler Voice Login</h1>
<form id="loginForm">
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required 
               placeholder="officer.bole@traffic.gov">
    </div>
    
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required 
               placeholder="Enter your password">
    </div>
    
    <button type="submit">Login</button>
</form>

<div id="testUsers" style="margin-top: 2rem; padding: 1rem; background: #f8f9fa; border-radius: 5px;">
    <h3 style="color: #666; margin-bottom: 1rem; text-align: center;">Test Users:</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
        <button type="button" onclick="fillCredentials('officer.bole@traffic.gov', 'officer123')" 
                style="background: #3498db; font-size: 0.8rem;">
            Traffic Officer (Bole)
        </button>
        <button type="button" onclick="fillCredentials('officer.piassa@traffic.gov', 'officer123')" 
                style="background: #3498db; font-size: 0.8rem;">
            Traffic Officer (Piassa)
        </button>
        <button type="button" onclick="fillCredentials('controller@traffic.gov', 'controller123')" 
                style="background: #9b59b6; font-size: 0.8rem;">
            Traffic Controller
        </button>
        <button type="button" onclick="fillCredentials('admin@traffic.gov', 'admin123')" 
                style="background: #e74c3c; font-size: 0.8rem;">
            Admin
        </button>
    </div>
</div>

<script>
    function fillCredentials(email, password) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = password;
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        try {
            const response = await fetch('/api/auth/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // Store user data in localStorage
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('token', 'logged-in'); // Simple token for demo
                
                // Redirect based on role
                redirectByRole(data.user.role);
            } else {
                showError(data.error || 'Login failed');
            }
        } catch (error) {
            showError('Network error: ' + error.message);
        }
    });

    function redirectByRole(role) {
        switch(role) {
            case 'traffic':
                window.location.href = '/officer/dashboard/';
                break;
            case 'controller':
                window.location.href = '/controller/dashboard/';
                break;
            case 'admin':
                window.location.href = '/admin/';
                break;
            default:
                showError('Unknown role: ' + role);
        }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Check if already logged in
    const user = localStorage.getItem('user');
    if (user) {
        const userData = JSON.parse(user);
        redirectByRole(userData.role);
    }
</script>
{% endblock %}
